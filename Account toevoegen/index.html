<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Toevoegen - Aurora Theater</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="form-box">

            <h1>Nieuw Account Toevoegen</h1>
            <p class="subtitle">Aurora Theater Beheer</p>

            <form action="#" method="POST">

                <div class="input-group">
                    <label>Volledige naam</label>
                    <input type="text" placeholder="Voer naam in" required>
                </div>

                <div class="input-group">
                    <label>E-mailadres</label>
                    <input type="email" placeholder="Voer e-mail in" required>
                </div>

                <div class="input-group">
                    <label>Wachtwoord</label>
                    <input type="password" placeholder="Maak een wachtwoord" required>
                </div>

                <div class="input-group">
                    <label>Rol</label>

                    <select required>
                        <option value="">Kies een rol</option>
                        <option>Admin</option>
                        <option>Medewerker</option>
                        <option>Bezoeker</option>
                    </select>
                </div>

                <button type="submit">Account Toevoegen</button>

            </form>

        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registreren - Aurora Theater</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="register-box">

            <h1>Aurora Theater</h1>
            <p class="subtitle">Maak een account aan</p>

            <form action="#" method="POST">

                <div class="input-group">
                    <label>Volledige naam</label>
                    <input type="text" placeholder="Voer je naam in" required>
                </div>

                <div class="input-group">
                    <label>E-mailadres</label>
                    <input type="email" placeholder="Voer je e-mail in" required>
                </div>

                <div class="input-group">
                    <label>Wachtwoord</label>
                    <input type="password" placeholder="Maak een wachtwoord" required>
                </div>

                <div class="input-group">
                    <label>Herhaal wachtwoord</label>
                    <input type="password" placeholder="Herhaal je wachtwoord" required>
                </div>

                <button type="submit">Registreren</button>

            </form>

            <p class="login-link">
                Heb je al een account?
                <a href="#">Inloggen</a>
            </p>

        </div>

    </div>

</body>
</html>

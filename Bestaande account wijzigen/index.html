<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Wijzigen - Aurora Theater</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="edit-box">

            <h1>Bestaand Account Wijzigen</h1>
            <p class="subtitle">Aurora Theater Beheer</p>

            <form action="#" method="POST">

                <div class="input-group">
                    <label>Volledige naam</label>
                    <input type="text" value="Ahmed Ali" required>
                </div>

                <div class="input-group">
                    <label>E-mailadres</label>
                    <input type="email" value="ahmed@email.com" required>
                </div>

                <div class="input-group">
                    <label>Nieuw wachtwoord</label>
                    <input type="password" placeholder="Nieuw wachtwoord">
                </div>

                <div class="input-group">
                    <label>Rol</label>

                    <select required>
                        <option>Admin</option>
                        <option>Medewerker</option>
                        <option selected>Bezoeker</option>
                    </select>
                </div>

                <div class="button-group">
                    <button type="submit" class="save-btn">
                        Wijzigingen Opslaan
                    </button>

                    <button type="reset" class="cancel-btn">
                        Annuleren
                    </button>
                </div>

            </form>

        </div>

    </div>

</body>
</html>

<body>

                <p><strong>Naam:</strong> Ahmed Ali</p>
                <p><strong>Email:</strong> ahmed@email.com</p>
                <p><strong>Rol:</strong> Bezoeker</p>

            </div>

            <div class="button-group">

                <button class="delete-btn">
                    Verwijderen

                <button class="cancel-btn">
                    Annuleren
                </button>

            </div>

        </div>

    </div>

</body>
</html>
